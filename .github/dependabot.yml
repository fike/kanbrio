# .github/dependabot.yml — Dependabot config for Kanbrio
#
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Updates are batched once per week (Monday ~03:00 UTC) with up to 5 open
# PRs per ecosystem to avoid flooding the PR queue. All Dependabot PRs
# receive the `dependencies` and `area: infra` labels so they can be
# filtered and triaged together.

version: 2

updates:
  # npm workspace — apps/web
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area: infra"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group non-major updates so a single PR covers patch/minor bumps.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # cargo workspace — apps/api
  - package-ecosystem: "cargo"
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area: infra"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows themselves (keeps `actions/checkout`,
  # `dtolnay/rust-toolchain`, etc. current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "area: infra"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
