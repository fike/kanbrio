name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password  # pragma: allowlist secret
          POSTGRES_DB: kanbrio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
          key: ${{ matrix.toolchain }}

      - name: Check Formatting
        run: cargo fmt --all -- --check
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/kanbrio_test  # pragma: allowlist secret

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/kanbrio_test  # pragma: allowlist secret
          SQLX_OFFLINE: "true"

      - name: Run Tests
        run: cargo test --all-targets
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/kanbrio_test  # pragma: allowlist secret
          SQLX_OFFLINE: "true"

  frontend:
    name: Frontend (SolidJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/web

      - name: Test
        run: npm test -w apps/web

      - name: Build
        run: npm run build -w apps/web

  cargo-deny:
    name: Cargo Deny (bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ban license sources
          arguments: --manifest-path apps/api/Cargo.toml
          rust-version: stable

  cargo-audit:
    name: Cargo Audit (known CVEs)
    runs-on: ubuntu-latest
    # Lightweight fail-fast: a known CVE in a direct dep should block.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock
        run: cargo audit --deny warnings
        working-directory: apps/api

  e2e:
    name: E2E (Playwright, 10 specs)
    runs-on: ubuntu-latest
    # Soft launch: do not block PR merges while we tune the stack.
    # Remove continue-on-error once 5 consecutive green runs on main land.
    continue-on-error: true
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password  # pragma: allowlist secret
          POSTGRES_DB: kanbrio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/kanbrio  # pragma: allowlist secret
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api

      - name: Install JS deps (root + e2e + web)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done

      - name: Apply migrations
        run: cargo run -- migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/kanbrio  # pragma: allowlist secret

      - name: Seed database (demo data)
        run: psql "$DATABASE_URL" -f scripts/seed.sql
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/kanbrio  # pragma: allowlist secret

      - name: Run E2E tests
        run: npx playwright test
        working-directory: apps/e2e

      - name: Upload Playwright HTML report on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14
