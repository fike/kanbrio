name: Release

# Triggered when a maintainer pushes a tag matching `v*.*.*` (SemVer).
# Generates a GitHub Release with body content parsed from CHANGELOG.md.
#
# To cut a release:
#   1. Update CHANGELOG.md:
#      * Move `[Unreleased]` entries to a new version section at the top
#        (after Unreleased) with an ISO 8601 date.
#      * Update the `[Unreleased]: ...compare vX.Y.Z...HEAD` link at the
#        bottom of the file to point to the new tag.
#      * Add a new `[X.Y.Z]: ...compare vP.Q.R...vX.Y.Z` link at the bottom.
#   2. Commit: `git commit -am "chore(release): v0.X.Y"` (Conventional Commits).
#   3. Tag:    `git tag -a v0.X.Y -m "Release v0.X.Y"`.
#   4. Push:   `git push origin main && git push origin v0.X.Y`.
#   5. This workflow publishes the release automatically.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git describe and CHANGELOG parsing

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api

      - name: Install JS deps
        run: npm ci

      - name: Build backend (release)
        run: cargo build --release
        working-directory: apps/api

      - name: Build frontend
        run: npm run build -w apps/web

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Extract the section between the version and the next version header.
          # The CHANGELOG.md format is Keep-a-Changelog 1.1.0 with the new
          # version section appearing after the [Unreleased] section.
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Pattern: header line "## [${VERSION}] - <date>" until the next "## [" line.
          # Print everything between those two markers, inclusive of the first,
          # exclusive of the next.
          NOTES=$(awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" { found=1 }
            found && $0 ~ "^## \\[" && $0 !~ "^## \\[" v "\\]" && $0 !~ "^## \\[Unreleased\\]" { exit }
            found { print }
          ' CHANGELOG.md)
          # GitHub Actions multiline output requires a delimiter for safety.
          {
            echo "NOTES<<EOF_RELEASE_NOTES"
            echo "${NOTES}"
            echo "EOF_RELEASE_NOTES"
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kanbrio v${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          body: ${{ env.NOTES }}
          tag_name: ${{ github.ref_name }}
          files: |
            apps/api/target/release/kanbrio-api
            apps/web/dist/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
